@if (showNav()) {
  <header class="top">
    <div>
      <p class="brand">Potty Log</p>
      <h1>{{ child() }}</h1>
    </div>
    <div class="top-actions">
      @if (interval() !== null) {
        <p class="interval-chip">{{ interval() }} min off potty</p>
      }
      <button type="button" class="quiet refresh" (click)="refresh()" [disabled]="api.busy() || refreshing()">
        {{ refreshing() ? 'Refreshing…' : 'Refresh' }}
      </button>
      <app-chat />
    </div>
  </header>
}

@if (api.error()) {
  <p class="banner error" role="alert">{{ api.error() }}</p>
}

<main [class.with-nav]="showNav()">
  <router-outlet />
</main>

@if (showNav()) {
  <nav class="dock" [class.with-people]="owner()" aria-label="Sections">
    <a routerLink="/now" routerLinkActive="active">Now</a>
    <a routerLink="/sheet" routerLinkActive="active">Sheet</a>
    @if (owner()) {
      <a routerLink="/people" routerLinkActive="active">People</a>
    }
    <a routerLink="/guide" routerLinkActive="active">Guide</a>
    <a routerLink="/settings" routerLinkActive="active">Settings</a>
  </nav>
}
