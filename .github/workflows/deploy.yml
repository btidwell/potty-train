name: Deploy

# Push to main only. Other branches use ci.yml and never start this workflow.
on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: frontend
          path: frontend/dist/frontend/browser
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: frontend
          path: frontend/dist/frontend/browser

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::143977713810:role/potty-log-github-deploy
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false

      - name: Package Lambda
        run: python backend/package_lambda.py

      - name: Apply
        working-directory: infra/terraform
        env:
          TF_IN_AUTOMATION: "true"
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve -lock-timeout=5m
          # Force-delete orphaned pre-aggregation secrets (no recovery window).
          # Idempotent once those names are gone. DeleteSecret deny is scoped to
          # potty-log only, so these three remain allowed.
          for name in potty-log-password potty-log-token-key potty-log-vapid; do
            for attempt in 1 2 3 4 5 6; do
              aws secretsmanager describe-secret --secret-id "$name" >/dev/null 2>&1 || break
              if aws secretsmanager delete-secret --secret-id "$name" --force-delete-without-recovery; then
                echo "Deleted $name"
                break
              fi
              if [ "$attempt" -eq 6 ]; then
                echo "Failed to delete $name" >&2
                exit 1
              fi
              sleep $((attempt * 10))
            done
          done
